
<!DOCTYPE html>
<html>
<head>
    <title>Checkout</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<nav>
    <h2>ShopEase</h2>
    <a href="/">Home</a>
</nav>

<div class="form-container">
    <h1>Checkout</h1>

    {% for item in cart %}
        <p>{{ item.name }} × {{ item.quantity }} = ₹{{ item.subtotal }}</p>
    {% endfor %}

    <h2>Total: ₹{{ total }}</h2>

    <form method="POST">
        <button type="submit">Place Order</button>
    </form>
</div>
</body>
</html>
