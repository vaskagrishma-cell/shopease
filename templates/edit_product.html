
<!DOCTYPE html>
<html>
<head>
    <title>Edit Product - ShopEase</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<nav>
    <h2>ShopEase Admin</h2>
    <a href="{{ url_for('admin') }}">Admin Dashboard</a>
    <a href="{{ url_for('logout') }}">Logout</a>
</nav>

<div class="container">
    <h1>Edit Product</h1>

    <form method="POST">
        <label>Product Name</label>
        <input type="text" name="name" value="{{ product.name }}" required>

        <label>Description</label>
        <textarea name="description" required>{{ product.description }}</textarea>

        <label>Price</label>
        <input type="number" step="0.01" name="price" value="{{ product.price }}" required>

        <label>Image Filename</label>
        <input type="text" name="image" value="{{ product.image }}" required>

        <label>Stock</label>
        <input type="number" name="stock" value="{{ product.stock }}" min="0" required>

        <button type="submit">Update Product</button>
    </form>

    <a href="{{ url_for('admin') }}">Back to Dashboard</a>
</div>

</body>
</html>
